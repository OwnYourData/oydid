<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3C6FD0"/>
    </marker>
    <marker id="orange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#E8873A"/>
    </marker>
  </defs>

  <rect width="1120" height="400" fill="#FFFFFF"/>

  <text x="24" y="36" font-size="20" font-weight="bold" fill="#222">Creating a did:oyd — CREATE</text>
  <text x="24" y="59" font-size="14" fill="#666">The repository computes every hash. The secure element only signs.</text>

  <!-- what the repository asks for -->
  <text x="255" y="112" font-size="14.5" font-weight="bold" fill="#222" text-anchor="middle">POST createIdentifier</text>
  <text x="255" y="130" font-size="12.5" fill="#666" text-anchor="middle">key_hex, rev_key_hex,</text>
  <text x="255" y="146" font-size="12.5" fill="#666" text-anchor="middle">DID document</text>

  <text x="470" y="112" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">subDidHash</text>
  <text x="470" y="130" font-size="12.5" fill="#666" text-anchor="middle">revocation entry</text>

  <text x="655" y="112" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">l2_doc</text>
  <text x="655" y="130" font-size="12.5" fill="#666" text-anchor="middle">TERMINATE entry</text>

  <text x="840" y="112" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">l1_doc</text>
  <text x="840" y="130" font-size="12.5" fill="#666" text-anchor="middle">CREATE entry</text>

  <!-- the line -->
  <text x="24" y="181" font-size="16" font-weight="bold" fill="#222">Exchange:</text>
  <line x1="150" y1="175" x2="960" y2="175" stroke="#555" stroke-width="3"/>
  <circle cx="255" cy="175" r="9" fill="#DDD" stroke="#555" stroke-width="3"/>
  <circle cx="470" cy="175" r="9" fill="#FFF" stroke="#555" stroke-width="3"/>
  <circle cx="655" cy="175" r="9" fill="#FFF" stroke="#555" stroke-width="3"/>
  <circle cx="840" cy="175" r="9" fill="#FFF" stroke="#555" stroke-width="3"/>
  <circle cx="935" cy="175" r="9" fill="#E8873A" stroke="#E8873A" stroke-width="3"/>

  <!-- result -->
  <line x1="949" y1="175" x2="988" y2="175" stroke="#E8873A" stroke-width="3"
        stroke-dasharray="7,5" marker-end="url(#orange)"/>
  <text x="1006" y="170" font-size="16" font-weight="bold" fill="#E8873A">DID</text>
  <text x="1006" y="191" font-size="13" fill="#E8873A">+ log_revoke</text>

  <!-- secure element -->
  <line x1="255" y1="238" x2="255" y2="190" stroke="#3C6FD0" stroke-width="2.5" marker-end="url(#blue)"/>
  <line x1="470" y1="238" x2="470" y2="190" stroke="#3C6FD0" stroke-width="2.5" marker-end="url(#blue)"/>
  <line x1="655" y1="238" x2="655" y2="190" stroke="#3C6FD0" stroke-width="2.5" marker-end="url(#blue)"/>
  <line x1="840" y1="238" x2="840" y2="190" stroke="#3C6FD0" stroke-width="2.5" marker-end="url(#blue)"/>

  <rect x="60" y="238" width="900" height="66" rx="9" fill="#EAF0FB" stroke="#3C6FD0" stroke-width="2"/>
  <text x="78" y="266" font-size="13.5" font-weight="bold" fill="#3C6FD0">Secure element</text>
  <text x="78" y="288" font-size="11.5" fill="#3C6FD0">operations</text>

  <text x="255" y="266" font-size="13.5" font-weight="bold" fill="#3C6FD0" text-anchor="middle">create() · pubkey()</text>
  <text x="255" y="288" font-size="12.5" fill="#3C6FD0" text-anchor="middle">"Doc-Key", "Rev-Key"</text>

  <text x="470" y="266" font-size="13.5" font-weight="bold" fill="#3C6FD0" text-anchor="middle">sign(digest)</text>
  <text x="470" y="288" font-size="12.5" fill="#3C6FD0" text-anchor="middle">"Rev-Key"</text>

  <text x="655" y="266" font-size="13.5" font-weight="bold" fill="#3C6FD0" text-anchor="middle">sign(digest)</text>
  <text x="655" y="288" font-size="12.5" fill="#3C6FD0" text-anchor="middle">"Doc-Key"</text>

  <text x="840" y="266" font-size="13.5" font-weight="bold" fill="#3C6FD0" text-anchor="middle">sign(digest)</text>
  <text x="840" y="288" font-size="12.5" fill="#3C6FD0" text-anchor="middle">"Doc-Key"</text>

  <!-- footer -->
  <text x="60" y="334" font-size="13" fill="#666">Four calls to the repository, three signatures in the secure element.</text>
  <text x="60" y="354" font-size="13" fill="#666">The private key never leaves the secure element — the repository stores no key material.</text>
  <text x="60" y="378" font-size="13" font-weight="bold" fill="#C0392B">Keep log_revoke — without it the DID can neither be updated nor revoked.</text>
</svg>
