# Renders the bikeshed specification (docs/index.bs) and pushes it to gh-pages.

name: Publish specification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  main:
    name: Build, Validate and Deploy
    # ubuntu-20.04 was retired by GitHub and fails before the first step runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: w3c/spec-prod@v2
        with:
          GH_PAGES_BRANCH: gh-pages
          TOOLCHAIN: bikeshed
          SOURCE: docs/index.bs
          DESTINATION: index.html
          VALIDATE_LINKS: false
          VALIDATE_MARKUP: false
          # bikeshed 7.x moved its group registry to speced/bikeshed-boilerplate,
          # where "w3c-ccg" is missing, so it reports a fatal "Unknown Group".
          # The document itself still renders byte-identically, so suppress the
          # gate until the group is added upstream, then drop this line again.
          BUILD_FAIL_ON: nothing
      - uses: w3c/spec-prod@v2
        with:
          GH_PAGES_BRANCH: gh-pages
          TOOLCHAIN: bikeshed
          SOURCE: docs/index.bs
          DESTINATION: did-method-oyd.html
          VALIDATE_LINKS: false
          VALIDATE_MARKUP: false
          BUILD_FAIL_ON: nothing
