# Continuous CI for the oydid ruby gem, on all branches and pull requests.

name: CI
on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    name: Ruby ${{ matrix.ruby }}
    if: "contains(github.event.commits[0].message, '[ci skip]') == false"
    runs-on: ubuntu-latest
    env:
      CI: true
      # the multicodecs gem reads its code table via CSV and raises
      # CSV::InvalidEncodingError without a UTF-8 locale
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    strategy:
      fail-fast: false
      matrix:
        # oydid.gemspec requires ruby >= 3.0 and pins openssl ~> 3.3 /
        # stringio ~> 3.2, so anything below 3.2 cannot even bundle install
        ruby:
          - '3.2'
          - '3.3'
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby-gem
      - name: Run tests
        working-directory: ruby-gem
        run: ruby --version && bundle exec rspec spec
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        if: "matrix.ruby == '3.3'"
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: "./ruby-gem/coverage/lcov.info"
