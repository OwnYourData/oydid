openapi: 3.0.0
info:
  title: OYDID API
  version: v1
  description: >-
     OYDID (Own Your Digital IDentifier) provides a self-sustained environment for managing digital identifiers (DIDs). The oyd:did method links the identifier cryptographically to the DID Document and through also cryptographically linked provenance information in a public log it ensures resolving to the latest valid version of the DID Document.

     Further information:
     - view other [OwnYourData Service API's](https://api-docs.ownyourdata.eu)
  contact:
    email: office@ownyourdata.eu
  license:
    name: Apache 2.0 License
    url: http://www.apache.org/licenses/LICENSE-2.0

servers:
- url: https://oydid.ownyourdata.eu/
  description: Official production system hosted by OwnYourData
security:
  - BearerAuth: []
paths:
  /doc/{did}:
    get:
      summary: read latest DID Document
      tags:
        - Documents
      parameters:
          - name: did
            in: path
            required: true
            schema:
              type: string
      responses:
        "200":
          description: resolved DID Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DidResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestBody"
  /doc:
    post:
      summary: create new or update existing DID Document
      tags:
        - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DidRequestBody"
      responses:
        "200":
          description: successfully created/update DID Document
        "400":
          description: Bad request
  /log/{id}:
    get:
      summary: retrieve log records
      tags:
        - Log
      parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
      responses:
        "200":
          description: success
  /log/{id}/item:
    get:
      summary: retriev specific log record
      tags:
        - Log
      parameters:
          - name: id
            in: path
            required: true
            description: hash value of log record
            schema:
              type: string
      responses:
        "200":
          description: success
  /log/{did}:
    post:
      summary: add new log entry
      tags:
        - Log
      parameters:
          - name: did
            in: path
            required: true
            schema:
              type: string
      responses:
        "200":
          description: success

  /1.0/identifiers/{identifier}:
    get:
      summary: Resolve a DID.
      tags:
        - Uniresolver Interface
      description:
        <p>This endpoint resolves a DID. As input it takes the DID, plus DID resolution
        <a href="https://www.w3.org/TR/did-core/#did-resolution-options">options</a>. The output is a DID
        document in one of the supported representations, plus metadata.</p>
        <p>See the <a href="https://w3c-ccg.github.io/did-resolution/">DID Resolution</a>
        specification for additional details.</p>
      operationId: resolve
      parameters:
        - in: path
          required: true
          name: identifier
          schema:
            type: string
          description: The DID to be resolved.
          examples:
            example1:
              value: did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh
              description: A DID using the `oyd` method.
        - in: header
          required: false
          name: Accept
          schema:
            type: string
          description: The requested media type of the DID document representation or DID resolution result. See <a href="https://www.w3.org/TR/did-core/#representations">https://www.w3.org/TR/did-core/#representations</a> and <a href="https://w3c-ccg.github.io/did-resolution/#did-resolution-result">https://w3c-ccg.github.io/did-resolution/#did-resolution-result</a>.
          examples:
            application/did+json:
              value: application/json
              description: Media type of a DID document (JSON representation).
            application/did+ld+json:
              value: application/did+ld+json
              description: Media type of a DID document (JSON-LD representation).
            application/ld+json;profile="https://w3id.org/did-resolution":
              value: application/ld+json;profile="https://w3id.org/did-resolution"
              description: Media type of a DID resolution result (JSON-LD representation).
      responses:
        '200':
          description: successfully resolved!
          content:
            application/did+json:
              schema:
                type: object
                description: The DID document (JSON representation).
            application/did+ld+json:
              schema:
                type: object
                description: The DID document (JSON-LD representation).
            application/ld+json;profile="https://w3id.org/did-resolution":
              schema:
                $ref: '#/components/schemas/ResolutionResult'
        '400':
          description: invalid input!
        '410':
          description: successfully resolved (deactivated)!
          content:
            application/did+json:
              schema:
                type: object
                description: The deactivated DID document (JSON representation).
            application/did+ld+json:
              schema:
                type: object
                description: The deactivated DID document (JSON-LD representation).
            application/ld+json;profile="https://w3id.org/did-resolution":
              schema:
                $ref: '#/components/schemas/ResolutionResult'
        '500':
          description: error!

  /1.0/create:
    post:
      summary: Create a DID.
      tags:
        - Uniregistrar Interface
      description:
        <p>This endpoint creates a DID. As input it takes the DID plus options, a DID document, and optionally secrets
        needed to create a DID. The output is a state object that represents the current state of the DID creation
        process.</p>
        <p>See the <a href="https://identity.foundation/did-registration/#create">DID Registration</a>
        specification for additional details.</p>
      operationId: create
      parameters:
        - in: query
          required: true
          name: method
          schema:
            type: string
          description: The requested DID method for the operation.
          example: oyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description:
            The request was successful, but the DID may not be fully created yet, as indicated by the
            "didState.state" and "jobId" output fields. Additional state information plus metadata are available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateState'
        '201':
          description:
            The DID has been successfully created, as indicated by the "didState.state" output field.
            Additional state information (including the created DID) plus metadata are available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateState'
        '400':
          description:
            A problem with the input fields has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateState'
        '500':
          description:
            An internal error has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateState'
  /1.0/update:
    post:
      summary: Update a DID.
      tags:
        - Uniregistrar Interface
      description:
        <p>This endpoint updates a DID. As input it takes the existing DID plus options, a DID document, and optionally secrets
        needed to update a DID. The output is a state object that represents the current state of the DID update
        process.</p>
        <p>See the <a href="https://identity.foundation/did-registration/#update">DID Registration</a>
        specification for additional details.</p>
      operationId: update
      parameters:
        - in: query
          required: true
          name: method
          schema:
            type: string
          description: The requested DID method for the operation.
          example: oyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
      responses:
        '200':
          description:
            The request was successful, and the DID may or may not be fully updated yet, as indicated by the
            "didState.state" and "jobId" output fields. Additional state information plus metadata are available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateState'
        '400':
          description:
            A problem with the input fields has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateState'
        '500':
          description:
            An internal error has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateState'
  /1.0/deactivate:
    post:
      summary: Deactivate a DID.
      tags:
        - Uniregistrar Interface
      description:
        <p>This endpoint deactivates a DID. As input it takes the existing DID plus options, and optionally secrets
        needed to deactivate a DID. The output is a state object that represents the current state of the DID deactivation
        process.</p>
        <p>See the <a href="https://identity.foundation/did-registration/#deactivate">DID Registration</a>
        specification for additional details.</p>
      operationId: deactivate
      parameters:
        - in: query
          required: true
          name: method
          schema:
            type: string
          description: The requested DID method for the operation.
          example: oyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateRequest'
      responses:
        '200':
          description:
            The request was successful, and the DID may or may not be fully deactivated yet, as indicated by the
            "didState.state" and "jobId" output fields. Additional state information plus metadata are available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateState'
        '400':
          description:
            A problem with the input fields has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateState'
        '500':
          description:
            An internal error has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateState'
  /1.0/createIdentifier:
    post:
      summary: Create a DID and store it locally.
      tags:
        - DID Provider Interface
      description:
        <p>This endpoint creates a DID and stores the DID Document and provenance log directly in this
        repository's database (no remote location is used). It returns the created DID together with the
        generated key material.</p>
        <p>The endpoint also supports the Client-Managed-Secret-Mode (CMSM), in which no private key ever
        reaches this repository. The client sends <code>options.cmsm = true</code> and its public key(s) as
        hex; every field besides <code>options</code>, <code>secret</code>, <code>key_hex</code> and
        <code>rev_key_hex</code> becomes the DID Document.</p>
        <p>Each incomplete phase answers with HTTP 201 and a challenge - <code>sign</code> is the value to
        sign and <code>with</code> names the key to sign it with. Every following call carries nothing but
        <code>options.session</code> and <code>options.sig</code>. The last phase answers with HTTP 200.</p>
        <p>With <code>key_hex</code> <em>and</em> <code>rev_key_hex</code> the revocation key is
        client-managed and the flow has four phases - <code>key-rev</code> over the revocation record,
        <code>key-doc</code> over the termination entry, <code>key-doc</code> over the creation entry. The
        order is forced by the data - each value is the hash of a structure containing the previous
        signature. With <code>key_hex</code> alone the revocation key is generated here and the flow has
        three phases; kept for compatibility, but the secret is then not client-managed.</p>
        <p>A session expires after 15 minutes and is deleted once the flow completes.</p>
        <p><strong>The <code>log_revoke</code> record returned with HTTP 200 has to be stored by the
        client.</strong> Its signature was made by a key this repository never sees, and a secure element
        does not have to sign deterministically, so the record cannot be rebuilt. Without it the DID can
        neither be updated nor revoked. It is a log entry, not a secret.</p>
      operationId: createIdentifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreateRequest'
      responses:
        '200':
          description: The DID was created and stored locally; the created DID and key material are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCreateResponse'
        '201':
          description:
            An incomplete CMSM phase - the intermediate data was persisted under the returned session and
            the response says which value to sign next, and with which key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmsmChallenge'
        '400':
          description: A problem with the input fields has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
  /1.0/updateIdentifier:
    post:
      summary: Update a locally stored DID.
      tags:
        - DID Provider Interface
      description:
        <p>This endpoint updates a DID whose current state is stored in this repository. The existing state is
        read from the local database; the new DID Document and log entries are stored locally again.</p>
        <p>In self-managed mode the controller keys are provided via the <code>secret</code> object. In
        client-managed mode the caller additionally supplies a <code>didDocument</code> together with
        pre-signed <code>log_revoke</code>, <code>log_update</code> and <code>log_terminate</code> records in
        <code>options</code>.</p>
        <p>In the Client-Managed-Secret-Mode (<code>options.cmsm = true</code>) the update runs in four
        phases, like the create flow. The first call carries the new <code>didDocument</code>, the new public
        key(s) as <code>key_hex</code> / <code>rev_key_hex</code>, and in <code>options.log_revoke_old</code>
        the revocation record the client received when the DID was created or last updated. Revoking the
        current document therefore needs no signature - the record already exists.</p>
        <p>The three challenges are <code>key-rev</code> over the revocation record of the new document,
        <code>key-doc</code> over its termination entry, and <code>key-doc-old</code> over the update entry.
        The last one is signed with the document key of the DID being replaced, which is what authorises the
        transition - that key has to still exist at this point. From the second phase on the request carries
        nothing but <code>options.session</code> and <code>options.sig</code>; which DID is being updated
        comes from the session.</p>
        <p><code>log_revoke_old</code> is checked against the current document, against the revocation key in
        it, and against the hash the TERMINATE entry of that document committed. A record belonging to a
        different DID cannot pass.</p>
      operationId: updateIdentifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdateRequest'
      responses:
        '200':
          description: The DID was updated and the new state stored locally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderUpdateResponse'
        '201':
          description:
            An incomplete CMSM phase - the response says which value to sign next, and with which key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmsmChallenge'
        '400':
          description:
            A problem with the input fields has occurred (invalid log signature, unusable or missing
            <code>log_revoke_old</code>, unknown or expired session).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '404':
          description: The DID to be updated is unknown to this repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
  /1.0/deactivateIdentifier:
    post:
      summary: Deactivate a locally stored DID.
      tags:
        - DID Provider Interface
      description:
        <p>This endpoint deactivates (revokes) a DID stored in this repository. The revocation log entry is
        generated from the controller keys supplied in the <code>secret</code> object and stored in the local
        database.</p>
        <p>A client whose keys never reach this repository instead supplies the <code>log_revoke</code>
        record it received when the DID was created or last updated. No signature is made at this point - the
        record was signed back then. It is checked against the current document, against the revocation key
        in it, and against the hash the TERMINATE entry of that document committed, and is then linked into
        the log. A re-signed record does not pass, because its hash would differ from the committed one -
        which is why clients have to keep the record they were given.</p>
      operationId: deactivateIdentifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderDeactivateRequest'
      responses:
        '200':
          description: The DID was deactivated; the revocation log entry was stored locally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDeactivateResponse'
        '400':
          description:
            The supplied <code>log_revoke</code> record does not belong to the current document of this DID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '404':
          description: The DID to be deactivated is unknown to this repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
components:
  schemas:
    BadRequestBody:
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: missing input
      required:
        - status
        - error
    DidRequestBody:
      properties:
        did:
          type: string
        did-document:
          type: object
        logs:
          type: array
          items:
            type: object
      required:
        - did
        - did-document
        - logs
    DidResponse:
      properties:
        did:
          description: JSON object with publicly accessible information
          type: object
        key:
          type: string
          description: public document and revocation key separated by a colon
        log:
          type: string
          description: pointer to provenance information
    ResolutionResult:
      description: The DID resolution result.
      type: object
      additionalProperties: false
      properties:
        didDocument:
          type: object
        didResolutionMetadata:
          type: object
        didDocumentMetadata:
          type: object
    CreateRequest:
      description: Input fields for the create operation.
      type: object
      additionalProperties: false
      properties:
        jobId:
          description:
            This input field is used to keep track of an ongoing DID creation process.
            See <a href="https://identity.foundation/did-registration/#jobid">https://identity.foundation/did-registration/#jobid</a>.
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        options:
          description:
            This input field contains an object with various options for the DID create operation, such as the network where the DID should be created.
            See <a href="https://identity.foundation/did-registration/#options">https://identity.foundation/did-registration/#options</a>.
          type: object
        secret:
          description:
            This input field contains an object with DID controller keys and other secrets needed for performing the DID create operation.
            See <a href="https://identity.foundation/did-registration/#secret">https://identity.foundation/did-registration/#secret</a>.
          type: object
          example: {"doc_pwd":"secret", "rev_pwd":"other_secret"}
        didDocument:
          description:
            This input field contains either a complete DID document, or an incremental change (diff) to a DID document.
            See <a href="https://identity.foundation/did-registration/#diddocument">https://identity.foundation/did-registration/#diddocument</a>.
          type: object
    UpdateRequest:
      description: Input fields for the update operation.
      type: object
      additionalProperties: false
      required:
        - did
      properties:
        jobId:
          description:
            This input field is used to keep track of an ongoing DID update process.
            See <a href="https://identity.foundation/did-registration/#jobid">https://identity.foundation/did-registration/#jobid</a>.
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        did:
          description:
            This input field indicates the DID that is the target of the DID update operation.
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        options:
          description:
            This input field contains an object with various options for the DID update operation.
            See <a href="https://identity.foundation/did-registration/#options">https://identity.foundation/did-registration/#options</a>.
          type: object
        secret:
          description:
            This input field contains an object with DID controller keys and other secrets needed for performing the DID update operation.
            See <a href="https://identity.foundation/did-registration/#secret">https://identity.foundation/did-registration/#secret</a>.
          type: object
        didDocumentOperation:
          description:
            This input field indicates which update operation should be applied to a DID’s associated DID document.
            See <a href="https://identity.foundation/did-registration/#diddocumentoperation">https://identity.foundation/did-registration/#diddocumentoperation</a>.
          type: array
          items:
            type: string
        didDocument:
          description:
            This input field contains either a complete DID document, or an incremental change (diff) to a DID document.
            See <a href="https://identity.foundation/did-registration/#diddocument">https://identity.foundation/did-registration/#diddocument</a>.
          type: array
          items:
            type: object
    DeactivateRequest:
      description: Input fields for the deactivate operation.
      type: object
      additionalProperties: false
      required:
        - did
      properties:
        jobId:
          description:
            This input field is used to keep track of an ongoing DID deactivation process.
            See <a href="https://identity.foundation/did-registration/#jobid">https://identity.foundation/did-registration/#jobid</a>.
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        did:
          description:
            This input field indicates the DID that is the target of the DID deactivation operation.
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        options:
          description:
            This input field contains an object with various options for the DID deactivate operation.
            See <a href="https://identity.foundation/did-registration/#options">https://identity.foundation/did-registration/#options</a>.
          type: object
        secret:
          description:
            This input field contains an object with DID controller keys and other secrets needed for performing the DID deactivate operation.
            See <a href="https://identity.foundation/did-registration/#secret">https://identity.foundation/did-registration/#secret</a>.
          type: object
    CreateState:
      description: The state after a create operation.
      type: object
      additionalProperties: false
      required:
        - didState
      properties:
        jobId:
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        didState:
          $ref: '#/components/schemas/DidState'
        didRegistrationMetadata:
          type: object
        didDocumentMetadata:
          type: object
    UpdateState:
      description: The state after an update operation.
      type: object
      additionalProperties: false
      required:
        - didState
      properties:
        jobId:
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        didState:
          $ref: '#/components/schemas/DidState'
        didRegistrationMetadata:
          type: object
        didDocumentMetadata:
          type: object
    DeactivateState:
      description: The state after a deactivate operation.
      type: object
      additionalProperties: false
      required:
        - didState
      properties:
        jobId:
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        didState:
          $ref: '#/components/schemas/DidState'
        didRegistrationMetadata:
          type: object
        didDocumentMetadata:
          type: object
    DidState:
      description: The current state of a DID.
      type: object
      additionalProperties: true
      properties:
        state:
          type: string
          example: "finished"
        did:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        secret:
          type: object
        didDocument:
          type: object
    ProviderKey:
      description: A key entry as returned by the DID Provider endpoints.
      type: object
      properties:
        kid:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh#key-doc"
        kms:
          type: string
          example: "local"
        type:
          type: string
          description: key type, e.g. Ed25519, X25519 or ES256
          example: "Ed25519"
        publicKeyHex:
          type: string
        privateKeyHex:
          type: string
          description: only present when the keys are managed by the repository (not in client-managed mode)
        jwk:
          type: object
          description: present instead of the *Hex fields for ES256 keys
    ProviderCreateRequest:
      description: Input fields for the local create operation (createIdentifier).
      type: object
      properties:
        options:
          description:
            Options for the create operation. Set <code>type</code> to "ES256" for a P-256 DID (otherwise an
            ed25519 DID is created). For CMSM set <code>cmsm</code> to true; from the second phase on give
            <code>session</code> and <code>sig</code> instead of the public keys.
          type: object
          example: {"cmsm": true, "key_type": "Secp256r1"}
        secret:
          description: DID controller keys and other secrets needed for the operation.
          type: object
          example: {"doc_pwd": "secret", "rev_pwd": "other_secret"}
        key_hex:
          description:
            hex-encoded public document key; required in the first CMSM phase. No multicodec and no
            multibase - 32 bytes for ed25519, 33 (compressed) or 65 (uncompressed) bytes for P-256.
          type: string
        rev_key_hex:
          description:
            hex-encoded public revocation key. Supplying it makes the revocation key client-managed and adds
            a phase in which the client signs the revocation record. Without it the revocation key is
            generated by this repository and the secret is not fully client-managed.
          type: string
    ProviderCreateResponse:
      description: Result of a successful create operation.
      type: object
      properties:
        did:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        controllerKeyId:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh#key-doc"
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKey'
        services:
          type: array
          items:
            type: object
        log_revoke:
          description:
            CMSM only - the revocation record of the new document. The client has to store it - without it
            the DID can neither be updated nor revoked, and it cannot be rebuilt because its signature was
            made by a key this repository never sees.
          $ref: '#/components/schemas/RevocationRecord'
    RevocationRecord:
      description:
        A REVOKE log entry. Its hash is committed in the TERMINATE entry of the document it belongs to,
        which is what makes it both unforgeable and impossible to re-create with a fresh signature.
      type: object
      properties:
        ts:
          type: integer
          example: 1787306400
        op:
          type: integer
          example: 1
        doc:
          type: string
          description: hash of the document this record revokes
        sig:
          type: string
          description: signature over the <code>doc</code> value by the revocation key
    CmsmChallenge:
      description:
        Response of an incomplete CMSM phase - the value to sign next and the key to sign it with.
      type: object
      properties:
        cmsm:
          type: boolean
          example: true
        session:
          type: string
          description: handle of this flow; send it back with every following call
          example: "cmsm-7f3a91c4"
        phase:
          type: integer
          description: number of signatures already collected plus one
          example: 1
        pk:
          type: string
          description: the registered public document key (multibase encoded)
        sign:
          type: string
          description: the value the client has to sign
        with:
          type: string
          description:
            which key to sign with - <code>key-rev</code> the revocation key, <code>key-doc</code> the
            document key, <code>key-doc-old</code> the document key of the DID being replaced
          enum: [key-rev, key-doc, key-doc-old]
    ProviderUpdateRequest:
      description: Input fields for the local update operation (updateIdentifier).
      type: object
      required:
        - args
      properties:
        args:
          type: object
          required:
            - did
          properties:
            did:
              type: string
              example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        didDocument:
          description: new DID Document; required for a client-managed update.
          type: object
        options:
          description:
            Options for the update operation. For a client-managed update provide the pre-signed
            <code>log_revoke</code>, <code>log_update</code> and <code>log_terminate</code> records here. For
            CMSM set <code>cmsm</code> to true and provide <code>log_revoke_old</code> in the first phase,
            then <code>session</code> and <code>sig</code>.
          type: object
        key_hex:
          description: hex-encoded new public document key; first CMSM phase only.
          type: string
        rev_key_hex:
          description: hex-encoded new public revocation key; first CMSM phase only.
          type: string
        secret:
          description: DID controller keys needed for a self-managed update.
          type: object
    ProviderUpdateResponse:
      description: Result of a successful update operation.
      type: object
      properties:
        did:
          type: string
        did_old:
          description: the DID that was replaced
          type: string
        provider:
          type: string
        controllerKeyId:
          type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKey'
        services:
          type: array
          items:
            type: object
        log_revoke:
          description:
            The revocation record of the new document; it replaces the one the client kept for the previous
            document and has to be stored in its place.
          $ref: '#/components/schemas/RevocationRecord'
    ProviderDeactivateRequest:
      description: Input fields for the local deactivate operation (deactivateIdentifier).
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: object
          required:
            - did
          properties:
            did:
              type: string
              example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        options:
          description:
            Options for the deactivate operation. For a client-managed deactivation provide the
            <code>log_revoke</code> record the client stored here.
          type: object
        secret:
          description: DID controller keys needed for a self-managed deactivation.
          type: object
    ProviderDeactivateResponse:
      description: Result of a successful deactivate operation.
      type: object
      properties:
        did:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        success:
          type: boolean
          example: true