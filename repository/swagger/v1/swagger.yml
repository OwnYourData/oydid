openapi: 3.0.0
info:
  title: OYDID API
  version: v1
  description: >-
     OYDID (Own Your Digital IDentifier) provides a self-sustained environment for managing digital identifiers (DIDs). The oyd:did method links the identifier cryptographically to the DID Document and through also cryptographically linked provenance information in a public log it ensures resolving to the latest valid version of the DID Document.

     Further information:
     - view other [OwnYourData Service API's](https://api-docs.ownyourdata.eu)
  contact:
    email: office@ownyourdata.eu
  license:
    name: Apache 2.0 License
    url: http://www.apache.org/licenses/LICENSE-2.0

servers:
- url: https://oydid.ownyourdata.eu/
  description: Official production system hosted by OwnYourData
security:
  - BearerAuth: []
paths:
  /doc/{did}:
    get:
      summary: read latest DID Document
      tags:
        - Documents
      parameters:
          - name: did
            in: path
            required: true
            schema:
              type: string
      responses:
        "200":
          description: resolved DID Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DidResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestBody"
  /doc:
    post:
      summary: create new or update existing DID Document
      tags:
        - Documents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DidRequestBody"
      responses:
        "200":
          description: successfully created/update DID Document
        "400":
          description: Bad request
  /log/{id}:
    get:
      summary: retrieve log records
      tags:
        - Log
      parameters:
          - name: id
            in: path
            required: true
            schema:
              type: string
      responses:
        "200":
          description: success
  /log/{id}/item:
    get:
      summary: retriev specific log record
      tags:
        - Log
      parameters:
          - name: id
            in: path
            required: true
            description: hash value of log record
            schema:
              type: string
      responses:
        "200":
          description: success
  /log/{did}:
    post:
      summary: add new log entry
      tags:
        - Log
      parameters:
          - name: did
            in: path
            required: true
            schema:
              type: string
      responses:
        "200":
          description: success

  /1.0/identifiers/{identifier}:
    get:
      summary: Resolve a DID.
      tags:
        - Uniresolver Interface
      description:
        <p>This endpoint resolves a DID. As input it takes the DID, plus DID resolution
        <a href="https://www.w3.org/TR/did-core/#did-resolution-options">options</a>. The output is a DID
        document in one of the supported representations, plus metadata.</p>
        <p>See the <a href="https://w3c-ccg.github.io/did-resolution/">DID Resolution</a>
        specification for additional details.</p>
      operationId: resolve
      parameters:
        - in: path
          required: true
          name: identifier
          schema:
            type: string
          description: The DID to be resolved.
          examples:
            example1:
              value: did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh
              description: A DID using the `oyd` method.
        - in: header
          required: false
          name: Accept
          schema:
            type: string
          description: The requested media type of the DID document representation or DID resolution result. See <a href="https://www.w3.org/TR/did-core/#representations">https://www.w3.org/TR/did-core/#representations</a> and <a href="https://w3c-ccg.github.io/did-resolution/#did-resolution-result">https://w3c-ccg.github.io/did-resolution/#did-resolution-result</a>.
          examples:
            application/did+json:
              value: application/json
              description: Media type of a DID document (JSON representation).
            application/did+ld+json:
              value: application/did+ld+json
              description: Media type of a DID document (JSON-LD representation).
            application/ld+json;profile="https://w3id.org/did-resolution":
              value: application/ld+json;profile="https://w3id.org/did-resolution"
              description: Media type of a DID resolution result (JSON-LD representation).
      responses:
        '200':
          description: successfully resolved!
          content:
            application/did+json:
              schema:
                type: object
                description: The DID document (JSON representation).
            application/did+ld+json:
              schema:
                type: object
                description: The DID document (JSON-LD representation).
            application/ld+json;profile="https://w3id.org/did-resolution":
              schema:
                $ref: '#/components/schemas/ResolutionResult'
        '400':
          description: invalid input!
        '410':
          description: successfully resolved (deactivated)!
          content:
            application/did+json:
              schema:
                type: object
                description: The deactivated DID document (JSON representation).
            application/did+ld+json:
              schema:
                type: object
                description: The deactivated DID document (JSON-LD representation).
            application/ld+json;profile="https://w3id.org/did-resolution":
              schema:
                $ref: '#/components/schemas/ResolutionResult'
        '500':
          description: error!

  /1.0/create:
    post:
      summary: Create a DID.
      tags:
        - Uniregistrar Interface
      description:
        <p>This endpoint creates a DID. As input it takes the DID plus options, a DID document, and optionally secrets
        needed to create a DID. The output is a state object that represents the current state of the DID creation
        process.</p>
        <p>See the <a href="https://identity.foundation/did-registration/#create">DID Registration</a>
        specification for additional details.</p>
      operationId: create
      parameters:
        - in: query
          required: true
          name: method
          schema:
            type: string
          description: The requested DID method for the operation.
          example: oyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      responses:
        '200':
          description:
            The request was successful, but the DID may not be fully created yet, as indicated by the
            "didState.state" and "jobId" output fields. Additional state information plus metadata are available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateState'
        '201':
          description:
            The DID has been successfully created, as indicated by the "didState.state" output field.
            Additional state information (including the created DID) plus metadata are available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateState'
        '400':
          description:
            A problem with the input fields has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateState'
        '500':
          description:
            An internal error has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateState'
  /1.0/update:
    post:
      summary: Update a DID.
      tags:
        - Uniregistrar Interface
      description:
        <p>This endpoint updates a DID. As input it takes the existing DID plus options, a DID document, and optionally secrets
        needed to update a DID. The output is a state object that represents the current state of the DID update
        process.</p>
        <p>See the <a href="https://identity.foundation/did-registration/#update">DID Registration</a>
        specification for additional details.</p>
      operationId: update
      parameters:
        - in: query
          required: true
          name: method
          schema:
            type: string
          description: The requested DID method for the operation.
          example: oyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
      responses:
        '200':
          description:
            The request was successful, and the DID may or may not be fully updated yet, as indicated by the
            "didState.state" and "jobId" output fields. Additional state information plus metadata are available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateState'
        '400':
          description:
            A problem with the input fields has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateState'
        '500':
          description:
            An internal error has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateState'
  /1.0/deactivate:
    post:
      summary: Deactivate a DID.
      tags:
        - Uniregistrar Interface
      description:
        <p>This endpoint deactivates a DID. As input it takes the existing DID plus options, and optionally secrets
        needed to deactivate a DID. The output is a state object that represents the current state of the DID deactivation
        process.</p>
        <p>See the <a href="https://identity.foundation/did-registration/#deactivate">DID Registration</a>
        specification for additional details.</p>
      operationId: deactivate
      parameters:
        - in: query
          required: true
          name: method
          schema:
            type: string
          description: The requested DID method for the operation.
          example: oyd
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateRequest'
      responses:
        '200':
          description:
            The request was successful, and the DID may or may not be fully deactivated yet, as indicated by the
            "didState.state" and "jobId" output fields. Additional state information plus metadata are available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateState'
        '400':
          description:
            A problem with the input fields has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateState'
        '500':
          description:
            An internal error has occurred. Additional state information plus metadata may be
            available in the response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateState'
  /1.0/createIdentifier:
    post:
      summary: Create a DID and store it locally.
      tags:
        - DID Provider Interface
      description:
        <p>This endpoint creates a DID and stores the DID Document and provenance log directly in this
        repository's database (no remote location is used). It returns the created DID together with the
        generated key material.</p>
        <p>The endpoint also supports the Client-Managed-Secret-Mode (CMSM) - when called with
        <code>options.cmsm = true</code> and the public key (<code>key_hex</code>) but without a signature,
        it persists the intermediate data and responds with HTTP 201 plus the value the client has to sign
        (field <code>sign</code>). A second call with the same public key and the resulting
        <code>options.sig</code> finishes the creation and returns HTTP 200.</p>
      operationId: createIdentifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCreateRequest'
      responses:
        '200':
          description: The DID was created and stored locally; the created DID and key material are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCreateResponse'
        '201':
          description:
            CMSM phase 1 - the public key was registered and intermediate data persisted; the response
            contains the value the client has to sign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CmsmChallenge'
        '400':
          description: A problem with the input fields has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
  /1.0/updateIdentifier:
    post:
      summary: Update a locally stored DID.
      tags:
        - DID Provider Interface
      description:
        <p>This endpoint updates a DID whose current state is stored in this repository. The existing state is
        read from the local database; the new DID Document and log entries are stored locally again.</p>
        <p>In self-managed mode the controller keys are provided via the <code>secret</code> object. In
        client-managed mode the caller additionally supplies a <code>didDocument</code> together with
        pre-signed <code>log_revoke</code>, <code>log_update</code> and <code>log_terminate</code> records in
        <code>options</code>.</p>
      operationId: updateIdentifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderUpdateRequest'
      responses:
        '200':
          description: The DID was updated and the new state stored locally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderUpdateResponse'
        '400':
          description: A problem with the input fields has occurred (e.g. invalid log signature).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '404':
          description: The DID to be updated is unknown to this repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
  /1.0/deactivateIdentifier:
    post:
      summary: Deactivate a locally stored DID.
      tags:
        - DID Provider Interface
      description:
        <p>This endpoint deactivates (revokes) a DID stored in this repository. The revocation log entry is
        generated from the controller keys supplied in the <code>secret</code> object and stored in the local
        database. In client-managed mode the caller can instead supply a pre-built <code>log_revoke</code>
        record in <code>options</code>.</p>
      operationId: deactivateIdentifier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderDeactivateRequest'
      responses:
        '200':
          description: The DID was deactivated; the revocation log entry was stored locally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDeactivateResponse'
        '404':
          description: The DID to be deactivated is unknown to this repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
        '500':
          description: An internal error has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestBody'
components:
  schemas:
    BadRequestBody:
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: missing input
      required:
        - status
        - error
    DidRequestBody:
      properties:
        did:
          type: string
        did-document:
          type: object
        logs:
          type: array
          items:
            type: object
      required:
        - did
        - did-document
        - logs
    DidResponse:
      properties:
        did:
          description: JSON object with publicly accessible information
          type: object
        key:
          type: string
          description: public document and revocation key separated by a colon
        log:
          type: string
          description: pointer to provenance information
    ResolutionResult:
      description: The DID resolution result.
      type: object
      additionalProperties: false
      properties:
        didDocument:
          type: object
        didResolutionMetadata:
          type: object
        didDocumentMetadata:
          type: object
    CreateRequest:
      description: Input fields for the create operation.
      type: object
      additionalProperties: false
      properties:
        jobId:
          description:
            This input field is used to keep track of an ongoing DID creation process.
            See <a href="https://identity.foundation/did-registration/#jobid">https://identity.foundation/did-registration/#jobid</a>.
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        options:
          description:
            This input field contains an object with various options for the DID create operation, such as the network where the DID should be created.
            See <a href="https://identity.foundation/did-registration/#options">https://identity.foundation/did-registration/#options</a>.
          type: object
        secret:
          description:
            This input field contains an object with DID controller keys and other secrets needed for performing the DID create operation.
            See <a href="https://identity.foundation/did-registration/#secret">https://identity.foundation/did-registration/#secret</a>.
          type: object
          example: {"doc_pwd":"secret", "rev_pwd":"other_secret"}
        didDocument:
          description:
            This input field contains either a complete DID document, or an incremental change (diff) to a DID document.
            See <a href="https://identity.foundation/did-registration/#diddocument">https://identity.foundation/did-registration/#diddocument</a>.
          type: object
    UpdateRequest:
      description: Input fields for the update operation.
      type: object
      additionalProperties: false
      required:
        - did
      properties:
        jobId:
          description:
            This input field is used to keep track of an ongoing DID update process.
            See <a href="https://identity.foundation/did-registration/#jobid">https://identity.foundation/did-registration/#jobid</a>.
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        did:
          description:
            This input field indicates the DID that is the target of the DID update operation.
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        options:
          description:
            This input field contains an object with various options for the DID update operation.
            See <a href="https://identity.foundation/did-registration/#options">https://identity.foundation/did-registration/#options</a>.
          type: object
        secret:
          description:
            This input field contains an object with DID controller keys and other secrets needed for performing the DID update operation.
            See <a href="https://identity.foundation/did-registration/#secret">https://identity.foundation/did-registration/#secret</a>.
          type: object
        didDocumentOperation:
          description:
            This input field indicates which update operation should be applied to a DID’s associated DID document.
            See <a href="https://identity.foundation/did-registration/#diddocumentoperation">https://identity.foundation/did-registration/#diddocumentoperation</a>.
          type: array
          items:
            type: string
        didDocument:
          description:
            This input field contains either a complete DID document, or an incremental change (diff) to a DID document.
            See <a href="https://identity.foundation/did-registration/#diddocument">https://identity.foundation/did-registration/#diddocument</a>.
          type: array
          items:
            type: object
    DeactivateRequest:
      description: Input fields for the deactivate operation.
      type: object
      additionalProperties: false
      required:
        - did
      properties:
        jobId:
          description:
            This input field is used to keep track of an ongoing DID deactivation process.
            See <a href="https://identity.foundation/did-registration/#jobid">https://identity.foundation/did-registration/#jobid</a>.
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        did:
          description:
            This input field indicates the DID that is the target of the DID deactivation operation.
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        options:
          description:
            This input field contains an object with various options for the DID deactivate operation.
            See <a href="https://identity.foundation/did-registration/#options">https://identity.foundation/did-registration/#options</a>.
          type: object
        secret:
          description:
            This input field contains an object with DID controller keys and other secrets needed for performing the DID deactivate operation.
            See <a href="https://identity.foundation/did-registration/#secret">https://identity.foundation/did-registration/#secret</a>.
          type: object
    CreateState:
      description: The state after a create operation.
      type: object
      additionalProperties: false
      required:
        - didState
      properties:
        jobId:
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        didState:
          $ref: '#/components/schemas/DidState'
        didRegistrationMetadata:
          type: object
        didDocumentMetadata:
          type: object
    UpdateState:
      description: The state after an update operation.
      type: object
      additionalProperties: false
      required:
        - didState
      properties:
        jobId:
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        didState:
          $ref: '#/components/schemas/DidState'
        didRegistrationMetadata:
          type: object
        didDocumentMetadata:
          type: object
    DeactivateState:
      description: The state after a deactivate operation.
      type: object
      additionalProperties: false
      required:
        - didState
      properties:
        jobId:
          type: string
          example: 6d85bcd0-2ea3-4288-ab00-15afadd8a156
        didState:
          $ref: '#/components/schemas/DidState'
        didRegistrationMetadata:
          type: object
        didDocumentMetadata:
          type: object
    DidState:
      description: The current state of a DID.
      type: object
      additionalProperties: true
      properties:
        state:
          type: string
          example: "finished"
        did:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        secret:
          type: object
        didDocument:
          type: object
    ProviderKey:
      description: A key entry as returned by the DID Provider endpoints.
      type: object
      properties:
        kid:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh#key-doc"
        kms:
          type: string
          example: "local"
        type:
          type: string
          description: key type, e.g. Ed25519, X25519 or ES256
          example: "Ed25519"
        publicKeyHex:
          type: string
        privateKeyHex:
          type: string
          description: only present when the keys are managed by the repository (not in client-managed mode)
        jwk:
          type: object
          description: present instead of the *Hex fields for ES256 keys
    ProviderCreateRequest:
      description: Input fields for the local create operation (createIdentifier).
      type: object
      properties:
        options:
          description:
            Options for the create operation. Set <code>type</code> to "ES256" for a P-256 DID (otherwise an
            ed25519 DID is created). For CMSM set <code>cmsm</code> to true and provide <code>sig</code> in the
            second phase.
          type: object
          example: {"cmsm": true, "key_type": "ed25519"}
        secret:
          description: DID controller keys and other secrets needed for the operation.
          type: object
          example: {"doc_pwd": "secret", "rev_pwd": "other_secret"}
        key_hex:
          description: hex-encoded public document key; required for the Client-Managed-Secret-Mode (CMSM).
          type: string
    ProviderCreateResponse:
      description: Result of a successful create operation.
      type: object
      properties:
        did:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        controllerKeyId:
          type: string
          example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh#key-doc"
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKey'
        services:
          type: array
          items:
            type: object
    CmsmChallenge:
      description: Response of CMSM phase 1 - the value the client has to sign.
      type: object
      properties:
        cmsm:
          type: boolean
          example: true
        pk:
          type: string
          description: the registered public key (multibase encoded)
        sign:
          type: string
          description: the value the client has to sign with its private document key
    ProviderUpdateRequest:
      description: Input fields for the local update operation (updateIdentifier).
      type: object
      required:
        - args
      properties:
        args:
          type: object
          required:
            - did
          properties:
            did:
              type: string
              example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        didDocument:
          description: new DID Document; required for a client-managed update.
          type: object
        options:
          description:
            Options for the update operation. For a client-managed update provide the pre-signed
            <code>log_revoke</code>, <code>log_update</code> and <code>log_terminate</code> records here.
          type: object
        secret:
          description: DID controller keys needed for a self-managed update.
          type: object
    ProviderUpdateResponse:
      description: Result of a successful update operation.
      type: object
      properties:
        did:
          type: string
        provider:
          type: string
        controllerKeyId:
          type: string
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ProviderKey'
        services:
          type: array
          items:
            type: object
    ProviderDeactivateRequest:
      description: Input fields for the local deactivate operation (deactivateIdentifier).
      type: object
      required:
        - identifier
      properties:
        identifier:
          type: object
          required:
            - did
          properties:
            did:
              type: string
              example: "did:oyd:zQmaBZTghndXTgxNwfbdpVLWdFf6faYE4oeuN2zzXdQt1kh"
        options:
          description:
            Options for the deactivate operation. For a client-managed deactivation provide a pre-built
            <code>log_revoke</code> record here.
          type: object
        secret:
          description: DID controller keys needed for a self-managed deactivation.
          type: object
    ProviderDeactivateResponse:
      description: Result of a successful deactivate operation.
      type: object
      properties:
        did:
          type: string
